site_name: Lilevitchi | Modding
site_url: https://lilevitchi.github.io/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  language: fr
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - navigation.indexes
    - navigation.expand

extra_javascript:
  - javascripts/random_tips.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - toc:
      permalink: false
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Accueil: index.md
  - Fallout 4: fallout4/index.md
  - Fallout London: fallout-london/index.md
  - Fallout New Vegas: fnv/index.md
  - Tale of Two Wastelands: ttw/index.md
  - Cyberpunk 2077: cyberpunk/index.md

extra:
  social:
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@Lilevitchi
      name: YouTube
    - icon: fontawesome/brands/twitch
      link: https://twitch.tv/lilevitchi
      name: Twitch
    - icon: fontawesome/brands/discord
      link: https://discord.gg/aFJxsPC
      name: Discord
    - icon: material/link
      link: https://www.nexusmods.com/profile/Lilevitchi
      name: Nexus Mods
    - icon: simple/kofi
      link: https://ko-fi.com/lilevitchi
      name: Soutenez-moi sur Ko-fi
