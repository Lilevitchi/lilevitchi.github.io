site_name: Lilevitchi | Modding
site_url: https://lilevitchi.github.io/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  language: fr
  palette:
    scheme: slate
    primary: black
    accent: deep orange
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - content.code.copy
    - navigation.indexes
    - navigation.expand
    - footer.hide.generator

plugins: []

extra_javascript:
  - javascripts/random_tips.js
  - javascripts/progress.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - toc:
      permalink: false
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Accueil:
         - Bienvenue: index.md
         - Page 1: accueil/page1.md
  - Fallout 4: fallout4/index.md
  - Fallout London: fallout-london/index.md
  - Fallout New Vegas: fnv/index.md
  - Tale of Two Wastelands: ttw/index.md
  - Cyberpunk 2077: cyberpunk/index.md
