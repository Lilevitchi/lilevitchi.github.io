site_name: Lilevitchi | Guides de Modding
theme:
  name: material
  language: fr
  palette:
    # Mode sombre automatique basé sur le système du visiteur
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
  features:
    - navigation.tabs # Menu horizontal en haut
    - navigation.sections # Sections claires à gauche
    - navigation.top # Bouton "retour en haut"
    - content.code.copy # Permet de copier tes commandes de downgrade en 1 clic
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition # Pour les encadrés "Attention", "Note", etc.
  - pymdownx.details
  - pymdownx.superfences
