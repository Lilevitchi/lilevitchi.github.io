site_name: <span style="color:#ff5722;">Lilevitchi</span> | Modding
site_url: https://lilevitchi.github.io/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png # C'est l'icône qui apparaîtra dans l'onglet
  language: fr
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

# Personnalisation poussée pour les couleurs de l'interface
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list

nav:
  - Accueil: index.md
  - Guide Fallout 4:
      - Introduction: fallout4/intro.md
      - Installation: fallout4/setup.md
  - Fallout London: fallout-london/index.md
  - Fallout New Vegas: fnv/index.md
  - Tale of Two Wastelands: ttw/index.md
  - Cyberpunk 2077: cyberpunk/index.md
