site_name: Lilevitchi | Guides de Modding
site_url: https://lilevitchi.github.io/

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list # Requis pour styliser les images et boutons

nav:
  - Accueil: index.md
  - Guide Fallout 4:
      - Introduction: fallout4/intro.md
      - Installation propre: fallout4/setup.md
      - Le Downgrade: fallout4/downgrade.md
      - Utilitaires de base: fallout4/utilities.md
