site_name: Lilevitchi | Modding
site_url: https://lilevitchi.github.io/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  language: fr
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - navigation.indexes
    - navigation.expand

extra_javascript:
  - javascripts/random_tips.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Accueil: index.md
  - Fallout 4:
      - Fallout 4: fallout4/index.md
      - Introduction: fallout4/intro.md
# - Fallout London: fallout-london/index.md
# - Fallout New Vegas: fnv/index.md
# - Tale of Two Wastelands: ttw/index.md
# - Cyberpunk 2077: cyberpunk/index.md
