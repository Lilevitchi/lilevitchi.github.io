{% for social in config.extra.social %}
  <a href="{{ social.link }}" target="_blank" rel="noopener" title="{{ social.name }}" class="md-social__link">
    {% if "nexusmods" in social.link %}
      <img src="{{ base_url }}/assets/icons/nexusmods.svg" alt="Nexus Mods" style="height: 1.1rem; vertical-align: middle; filter: brightness(0) invert(1);">
    {% else %}
      {% include ".icons/" ~ social.icon ~ ".svg" %}
    {% endif %}
  </a>
{% endfor %}
