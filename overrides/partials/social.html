<div class="md-footer-social">
  {% for social in config.extra.social %}
    <a href="{{ social.link }}"
       target="_blank"
       rel="noopener"
       title="{{ social.name }}"
       class="md-footer-social__link">

      {% if "nexusmods" in social.link %}
        <img src="{{ base_url }}/assets/icons/nexusmods.svg"
             alt="Nexus Mods"
             class="md-footer-social__icon">
      {% else %}
        {% include ".icons/" ~ social.icon ~ ".svg" %}
      {% endif %}

    </a>
  {% endfor %}
</div>
