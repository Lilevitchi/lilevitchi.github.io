{% for social in config.extra.social %}
  <a href="{{ social.link }}" target="_blank" rel="noopener" title="{{ social.name }}" class="md-social__link" style="margin-right: 15px !important; width: auto !important;">
    {% if "nexusmods" in social.link %}
      <img src="{{ base_url }}/assets/icons/nexusmods.svg" class="custom-social-icon">
    {% else %}
      {% include ".icons/" ~ social.icon ~ ".svg" %}
    {% endif %}
  </a>
{% endfor %}
